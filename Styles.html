<style>
:root {
  --ce-blue: #0b5fa8;
  --ce-blue-dark: #08457c;
  --ce-blue-soft: #dceef9;
  --ce-green: #64b743;
  --ce-green-dark: #2f7c2d;
  --ce-green-soft: #e6f4d8;
  --ink: #162033;
  --muted: #65758b;
  --line: #d8e3ec;
  --surface: #ffffff;
  --page: #f4f9fc;
  --danger: #b42318;
  --warning: #fff4d6;
  --shadow: 0 18px 50px rgba(8, 69, 124, .12);
  font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: linear-gradient(135deg, var(--page), #eef8ea);
}
button, input, select { font: inherit; }
.hidden { display: none !important; }

.app-shell { min-height: 100vh; }
.login-view {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr);
  gap: 32px;
  align-items: center;
  padding: 48px;
}
.brand-panel h1 {
  margin: 20px 0 10px;
  font-size: clamp(36px, 6vw, 72px);
  color: var(--ce-blue-dark);
}
.brand-panel p {
  max-width: 620px;
  color: var(--muted);
  font-size: 19px;
  line-height: 1.6;
}
.brand-mark { width: min(280px, 58vw); display: block; }
.login-card, .panel, .stat-card {
  background: rgba(255, 255, 255, .94);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
}
.login-card {
  padding: 28px;
  display: grid;
  gap: 18px;
}
h2, h3 { margin: 0; }
label {
  display: grid;
  gap: 7px;
  color: var(--ce-blue-dark);
  font-weight: 700;
  font-size: 13px;
}
input, select {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 10px 12px;
  color: var(--ink);
  background: var(--surface);
  outline: none;
}
input:focus, select:focus {
  border-color: var(--ce-blue);
  box-shadow: 0 0 0 3px rgba(11, 95, 168, .14);
}
.btn, .nav-item {
  min-height: 42px;
  border: 1px solid transparent;
  border-radius: 7px;
  padding: 10px 14px;
  cursor: pointer;
  font-weight: 800;
}
.btn.primary {
  color: #fff;
  background: var(--ce-blue);
}
.btn.green {
  color: #fff;
  background: var(--ce-green-dark);
}
.btn:hover, .nav-item:hover { filter: brightness(.96); }
.form-note { margin: 0; color: var(--muted); font-size: 13px; }

.dashboard {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 260px 1fr;
}
.sidebar {
  padding: 18px;
  background: var(--ce-blue-dark);
  color: #fff;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.sidebar-brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding-bottom: 18px;
  margin-bottom: 8px;
  border-bottom: 1px solid rgba(255, 255, 255, .18);
}
.sidebar-brand img {
  width: 52px;
  height: 52px;
  object-fit: contain;
  background: #fff;
  border-radius: 7px;
}
.sidebar-brand span { display: block; color: var(--ce-blue-soft); font-size: 12px; }
.nav-item {
  width: 100%;
  text-align: left;
  color: #eaf6ff;
  background: transparent;
}
.nav-item.active {
  color: var(--ce-blue-dark);
  background: #fff;
}
.nav-item.logout {
  margin-top: auto;
  color: #fff;
  background: rgba(255, 255, 255, .12);
}
.content { padding: 26px; overflow: auto; }
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 22px;
}
.eyebrow { color: var(--ce-green-dark); font-weight: 900; text-transform: uppercase; font-size: 12px; }
.user-chip {
  background: var(--ce-green-soft);
  color: var(--ce-green-dark);
  border: 1px solid #c9e7bb;
  border-radius: 7px;
  padding: 9px 12px;
  font-weight: 800;
}
.view { display: none; }
.view.active { display: grid; gap: 18px; }
.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}
.stat-card { padding: 18px; }
.stat-card span { color: var(--muted); font-weight: 800; font-size: 13px; }
.stat-card strong { display: block; margin-top: 8px; color: var(--ce-blue-dark); font-size: 32px; }
.stat-card.green strong { color: var(--ce-green-dark); }
.stat-card.alert { background: var(--warning); }
.stat-card.alert strong { color: var(--danger); }
.panel { overflow: hidden; }
.panel-head {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  padding: 18px;
}
.form-grid .btn { align-self: end; }
.table-wrap { width: 100%; overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 720px;
}
th, td {
  padding: 12px 14px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
th {
  color: var(--ce-blue-dark);
  background: var(--ce-blue-soft);
  font-size: 12px;
  text-transform: uppercase;
}
td { color: var(--ink); }
.badge {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  border-radius: 999px;
  padding: 4px 10px;
  font-weight: 800;
  font-size: 12px;
  background: var(--ce-green-soft);
  color: var(--ce-green-dark);
}
.badge.low { background: #ffe4e0; color: var(--danger); }
.search { max-width: 260px; }
.toast {
  position: fixed;
  right: 18px;
  bottom: 18px;
  max-width: 360px;
  padding: 12px 14px;
  border-radius: 8px;
  color: #fff;
  background: var(--ce-blue-dark);
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: .2s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 900px) {
  .login-view, .dashboard { grid-template-columns: 1fr; }
  .login-view { padding: 26px; }
  .sidebar { position: static; }
  .stat-grid, .form-grid { grid-template-columns: 1fr; }
  .topbar { align-items: flex-start; flex-direction: column; }
}
</style>
